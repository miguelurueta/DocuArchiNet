<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maqueta — Inicio de sesión DocuArchi</title>
  <style>
    :root { --blue:#2563eb; --blue-dark:#1d4ed8; --ink:#0f172a; --muted:#64748b; --line:#d8e2f0; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:var(--ink); font:16px "Segoe UI",Arial,sans-serif; background:radial-gradient(circle at 15% 15%,#dbeafe 0,transparent 34%),radial-gradient(circle at 85% 80%,#e0f2fe 0,transparent 36%),#f8fafc; }
    .login-card { width:min(100%,380px); padding:34px 28px 26px; border:1px solid rgba(203,213,225,.8); border-radius:24px; background:rgba(255,255,255,.94); box-shadow:0 30px 80px rgba(15,23,42,.16),0 14px 34px rgba(37,99,235,.1); }
    .brand { display:grid; place-items:center; gap:8px; margin:0 0 30px; text-align:center; }
    .brand-mark { width:62px; height:62px; display:grid; place-items:center; border-radius:18px; color:#fff; background:linear-gradient(135deg,var(--blue),#0ea5e9); box-shadow:0 12px 22px rgba(37,99,235,.25); font-size:26px; font-weight:700; }
    .brand h1 { margin:0; font-size:21px; letter-spacing:-.3px; }
    .brand p { margin:0; color:var(--muted); font-size:13px; }
    .field { position:relative; margin:0 0 14px; }
    .field select, .field input { width:100%; height:54px; border:1px solid var(--line); border-radius:12px; outline:0; color:var(--ink); background:#fff; padding:19px 44px 5px 46px; font:inherit; transition:border-color .18s,box-shadow .18s; }
    .field select { padding:0 42px 0 15px; appearance:auto; }
    .field input:focus, .field select:focus { border-color:var(--blue); box-shadow:0 0 0 4px rgba(37,99,235,.12); }
    .field label { position:absolute; top:8px; left:46px; color:var(--blue); font-size:11px; font-weight:600; pointer-events:none; }
    .field .icon { position:absolute; left:16px; top:17px; color:var(--blue); font-size:19px; pointer-events:none; }
    .field .toggle { position:absolute; right:11px; top:10px; width:34px; height:34px; border:0; border-radius:9px; color:var(--muted); background:transparent; cursor:pointer; font-size:17px; }
    .field .toggle:hover { color:var(--blue); background:#eff6ff; }
    .message { min-height:18px; margin:-6px 0 10px; color:#dc2626; font-size:12px; }
    .submit { position:relative; width:100%; min-height:54px; margin-top:4px; border:0; border-radius:12px; color:white; background:linear-gradient(90deg,var(--blue),var(--blue-dark)); box-shadow:0 12px 24px rgba(37,99,235,.22); cursor:pointer; font:600 16px inherit; transition:transform .16s,box-shadow .16s; }
    .submit:hover { transform:translateY(-1px); box-shadow:0 16px 28px rgba(37,99,235,.28); }
    .submit:active { transform:translateY(0); }
    .recovery { display:block; margin-top:18px; color:var(--muted); text-align:center; font-size:13px; text-decoration:none; }
    .recovery:hover { color:var(--blue); }
    .note { margin:24px auto 0; max-width:380px; color:#475569; text-align:center; font-size:12px; }
    @media (max-width:420px) { body { padding:16px; } .login-card { padding:28px 20px 22px; border-radius:20px; } }
  </style>
</head>
<body>
  <main>
    <section class="login-card" aria-label="Inicio de sesión">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">DA</div>
        <h1>DocuArchi Gestor</h1>
        <p>Acceso seguro a gestión documental</p>
      </header>
      <form id="demo-login" novalidate>
        <div class="field">
          <select id="module" aria-label="Módulo">
            <option value="">Seleccione un módulo</option>
            <option>Gestión documental</option>
            <option>Workflow</option>
            <option>Radicación</option>
          </select>
        </div>
        <div class="field">
          <span class="icon" aria-hidden="true">♙</span>
          <input id="user" type="text" autocomplete="username" placeholder=" " aria-describedby="validation">
          <label for="user">Usuario</label>
        </div>
        <div class="field">
          <span class="icon" aria-hidden="true">⌑</span>
          <input id="password" type="password" autocomplete="current-password" placeholder=" ">
          <label for="password">Contraseña</label>
          <button class="toggle" type="button" aria-label="Mostrar contraseña" title="Mostrar contraseña">◉</button>
        </div>
        <div class="message" id="validation" role="status"></div>
        <button class="submit" type="submit">Iniciar sesión</button>
        <a class="recovery" href="#" onclick="return false;">¿Olvidaste la contraseña?</a>
      </form>
    </section>
    <p class="note">Maqueta visual. No autentica usuarios ni se conecta al sistema.</p>
  </main>
  <script>
    (function () {
      var form = document.getElementById('demo-login');
      var password = document.getElementById('password');
      var toggle = document.querySelector('.toggle');
      var message = document.getElementById('validation');
      toggle.addEventListener('click', function () {
        var visible = password.type === 'text';
        password.type = visible ? 'password' : 'text';
        toggle.textContent = visible ? '◉' : '◌';
        toggle.setAttribute('aria-label', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
      });
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        message.textContent = (!document.getElementById('module').value || !document.getElementById('user').value.trim() || !password.value)
          ? 'Seleccione un módulo e informe usuario y contraseña.'
          : 'Maqueta válida: la autenticación real permanece en WebForms.';
      });
    }());
  </script>
</body>
</html>
