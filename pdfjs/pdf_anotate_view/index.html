<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>PDF Annotation And Drawing Markup Plugin Example</title>
	<script src="../../js/java_general/general_code_java.js"></script>
	<link rel="stylesheet" href="./styles.css">
	<link href="../../Styles/Aplicaction.css" rel="stylesheet" />
	<link rel="stylesheet" href="./pdfannotate.css">
	<link href="pdftoolbar.css" rel="stylesheet" />
	<link href="pdfjs-viewer.css" rel="stylesheet" />
	<link href="../../Awesome/css/fontawesome.css" rel="stylesheet" />
	<link href="../../Awesome/css/brands.css" rel="stylesheet" />
	<link href="../../Awesome/css/solid.css" rel="stylesheet" />
	<script src="../../Awesome/js/all.js" type="text/javascript"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

	<style>
		body {
			font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
			margin: 0;
			padding: 0;
		}

		.pdfviewer {
			height: 100%;
			margin: 0;
			padding: 0;
			display: flex;
			flex-direction: column;
		}

		.pdfviewer-container {
			margin: 0;
			padding: 0;
			display: flex;
			overflow: hidden;
			flex: 1;
			height: 100%;
		}

		.thumbnails {
			width: 150px !important;
			border: 1px solid #aaa;
			border-right: 3px solid #999;
			background: #ccc;
		}

			.thumbnails .pdfpage.selected {
				border: 2px solid #777;
				border-radius: 2px;
			}

		.maindoc {
			flex: 1;
		}

		.hide {
			display: none;
		}

		input[type="file"] {
			display: none;
		}
	</style>
</head>
<body>
	<div class="pdfviewer">
		<div class="toolbar pdftoolbar_" id="tool_pdf">
			<div class="tool">
				<input type="text" class="form-control" style="text-align:center" value="" id="pdf_page_find" max="0" disabled="disabled">
			</div>
			<div class="tool">
				<p>/</p>
			</div>
			<div class="tool">
				<input type="text" class="form-control " style="text-align:center" value="" id="num_page_total" disabled="disabled">
			</div>
			<div class="tool">
				<button class="tool-button"><i class="fal fa-minus" title="Alejar" id="pdf_btn_zon_minus"></i></button>
			</div>
			<div class="tool">
				<button class="tool-button"><i class="fal fa-plus" title="Acercar" id="pdf_btn_zon_plus"></i></button>
			</div>
			<div class="tool">
				<button class="tool-button"><i class="fad fa-edit" title="Anotación firma en tableta digital" id="pdf_btn_tbl_digital"></i></button>
			</div>
			<div class="tool">
				<button class="tool-button"><i class="fad fa-signature" title="Anotación firma personal" id="pdf_btn_tbl_sing"></i> </button>
			</div>
			<div class="tool">
				<button class="tool-button"><i class="fad fa-undo" title="redo" id="pdf_btn_tbl_desk_undo"></i> </button>
			</div>
			<div class="tool">
				<button class="tool-button"><i class="fad fa-redo" title="redo" id="pdf_btn_tbl_desk_redo"></i> </button>
			</div>

			<div class="tool">
				<button class="tool-button"><i class="fal fa-arrow-down" title="Descarga" id="pdf_btn_down_load"></i> </button>
			</div>
			<div class="tool">
				<button class="tool-button"><i class="fal fa-print" title="Imprimir" id="pdf_btn_printer_page"></i> </button>
			</div>
			<div class="dropdown  tool" >
				<button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
					
				</button>
				<ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
					<li id="pdf_a_paramneter_grafo"><a id="" class="dropdown-item" href="#">Parametros del grafo</a></li>					
				</ul>
			</div>	
		</div>
		<div class="pdfviewer-container" id="container-general">

			<div class="thumbnails pdfjs-viewer d-none">
			</div>
			<div id="pdf-container_" class="maindoc pdfjs-viewer">
			</div>
		</div>
	</div>

	<!-- Modal -->
	<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="exampleModalLabel">Configuración stamp de grafo</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<div class="row">
						<div class="col-6">
							<span>Activa fondo transparente al grafo</span>
						</div>
						<div class="col-6">
							<input id="checkbox_itext_stamp" type="checkbox" />
						</div>
					</div>
					
				    <div class="row">
						<div class="col-6">
							 <span>Porcentaje de transparencia del grafo</span>
						</div>
						<div class="col-6">
							<select id="select_itext_stamp">
	                           <option></option>

                            </select>						
						   </div>
				     </div>	
					
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
					<button id="Pdf_btn_update_insert" type="button" class="btn btn-primary">Aceptar</button>
				</div>
			</div>
		</div>
	</div>
	<div class="modal fade" id="dataModal" tabindex="-1" role="dialog" aria-labelledby="dataModalLabel" aria-hidden="true" style="display:none">
		<div class="modal-dialog modal-lg" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="dataModalLabel">PDF annotation data</h5>
					<button type="button" class="close" data-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<div class="modal-body">
					<pre class="prettyprint lang-json linenums">
				</pre>
				</div>
			</div>
		</div>

	</div>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
	<script src="../../js/sizeimagejquery.js" type="text/javascript"></script>
	<link href="w3.css" rel="stylesheet" />
	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js" integrity="sha512-ml/QKfG3+Yes6TwOzQb7aCNtJF4PUyha6R3w8pSTo/VJSywl7ZreYvvtUso7fKevpsI+pYVVwnu82YO0q3V6eg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	<script src="./pdf_viewer_anotate.js"></script>
	<!--<script src="./pdfannotate.js"></script>-->
	<script src="./script.js"></script>
	<link href="../../Styles/bootra-person.css" rel="stylesheet" />
	<script type="text/javascript">
		var _gaq = _gaq || [];
		_gaq.push(['_setAccount', 'UA-36251023-1']);
		_gaq.push(['_setDomainName', 'jqueryscript.net']);
		_gaq.push(['_trackPageview']);
		(function () {
			var ga = document.createElement('script'); ga.type = 'text/javascript'; ga.async = true;
			ga.src = ('https:' == document.location.protocol ? 'https://ssl' : 'http://www') + '.google-analytics.com/ga.js';
			var s = document.getElementsByTagName('script')[0]; s.parentNode.insertBefore(ga, s);
		})();

	</script>

</body>
</html>
