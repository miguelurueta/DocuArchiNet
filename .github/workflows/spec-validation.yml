name: Spec Validation

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate-spec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --run

      - name: Validate OpenSpec mapping
        run: npm run spec:validate
