name: OPSXJ validation

on:
  pull_request:
    paths:
      - "tools/opsxj/**"
      - "openspec/**"
      - "Doc/Actualizacion/workflow/ImportarServicioWeb/**"
      - "Doc/Actualizacion/workflow/ImportarServiciWebEnlace/**"
      - "Doc/Actualizacion/Login/Implementacion/DOC-91/**"
      - "Doc/Actualizacion/Login/Implementacion/DOC-92/**"
      - "Doc/Actualizacion/Login/Implementacion/DOC-93/**"
      - "Modelo/Login/SegundoFactor/**"
      - "DTOs/Login/SegundoFactor/**"
      - "Infrastructure/Login/SegundoFactor/**"
      - "Infrastructure/Repositories/Login/SegundoFactor/**"
      - "webservice/Login/SegundoFactor/**"
      - "js/workflow/importar-servicio-web/**"
      - "DTOs/Workflow/ImportarServicioWeb/**"
      - "Modelo/Workflow/ImportarServicioWeb/**"
      - "webservice/WebServiceImportarServicioWebModern.asmx.vb"
      - "workflow/Webworkflow.aspx.vb"
      - "tests/doc72-technical-documentation.test.cjs"
      - "tests/doc80-technical-documentation.test.cjs"
      - "tests/doc81-technical-documentation.test.cjs"
      - "tests/doc82-technical-documentation.test.cjs"
      - "tests/doc91-technical-documentation.test.cjs"
      - "tests/doc92-technical-documentation.test.cjs"
      - "tests/doc93-technical-documentation.test.cjs"
      - "tests/login-second-factor-smtp.test.cjs"
      - "tests/LoginSecondFactorSmtpBehaviorTests.cs"
      - "tests/MySqlParameterTestDouble.vb"
      - "tools/validation/Validate-Doc72DotNetSymbols.ps1"
      - "tools/validation/Doc72SourceValidator/**"
      - ".github/workflows/opsxj-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: OpenSpec and opsxj tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/opsxj/package-lock.json

      - name: Install opsxj dependencies
        run: npm.cmd --prefix tools/opsxj ci

      - name: Run opsxj tests
        run: npm.cmd --prefix tools/opsxj test

      - name: Validate DOC-72 diagrams and JavaScript symbols
        run: node --test tests/doc72-technical-documentation.test.cjs

      - name: Validate DOC-72 .NET signatures with Roslyn
        run: dotnet run --project ./tools/validation/Doc72SourceValidator/Doc72SourceValidator.csproj -- ./Doc/Actualizacion/workflow/ImportarServicioWeb/DOC-72-nucleo-registro-adaptadores/diagram-contract.json .

      - name: Validate DOC-80 text diagrams and documentation contract
        run: node --test tests/doc80-technical-documentation.test.cjs

      - name: Validate DOC-80 .NET signatures with Roslyn
        run: dotnet run --project ./tools/validation/Doc72SourceValidator/Doc72SourceValidator.csproj -- ./Doc/Actualizacion/workflow/ImportarServiciWebEnlace/DOC-80-capacidad-consulta-preview/diagram-contract.json .

      - name: Validate DOC-81 text diagrams and documentation contract
        run: node --test tests/doc81-technical-documentation.test.cjs

      - name: Validate DOC-81 .NET signatures with Roslyn
        run: dotnet run --project ./tools/validation/Doc72SourceValidator/Doc72SourceValidator.csproj -- ./Doc/Actualizacion/workflow/ImportarServiciWebEnlace/DOC-81-preparacion-persistencia-reconciliacion/diagram-contract.json .

      - name: Validate DOC-82 UML and JavaScript symbols
        run: node --test tests/doc82-technical-documentation.test.cjs

      - name: Validate DOC-82 .NET signatures with Roslyn
        run: dotnet run --project ./tools/validation/Doc72SourceValidator/Doc72SourceValidator.csproj -- ./Doc/Actualizacion/workflow/ImportarServiciWebEnlace/DOC-82-interfaz-integracion-asignacion/diagram-contract.json .

      - name: Validate DOC-91 Mermaid diagrams and documentation contract
        run: node --test tests/doc91-technical-documentation.test.cjs

      - name: Validate DOC-91 .NET declarations and signatures with Roslyn
        run: dotnet run --project ./tools/validation/Doc72SourceValidator/Doc72SourceValidator.csproj -- ./Doc/Actualizacion/Login/Implementacion/DOC-91/diagram-contract.json .

      - name: Validate DOC-92 Mermaid diagrams and documentation contract
        run: node --test tests/doc92-technical-documentation.test.cjs

      - name: Validate DOC-92 .NET declarations, relationships and signatures with Roslyn
        run: dotnet run --project ./tools/validation/Doc72SourceValidator/Doc72SourceValidator.csproj -- ./Doc/Actualizacion/Login/Implementacion/DOC-92/diagram-contract.json .

      - name: Validate DOC-93 Mermaid diagrams and documentation contract
        run: node --test tests/doc93-technical-documentation.test.cjs

      - name: Validate DOC-93 .NET declarations, relationships and signatures with Roslyn
        run: dotnet run --project ./tools/validation/Doc72SourceValidator/Doc72SourceValidator.csproj -- ./Doc/Actualizacion/Login/Implementacion/DOC-93/diagram-contract.json .

      - name: Validate DOC-93 SMTP contracts without network
        run: node --test tests/login-second-factor-smtp.test.cjs

      - name: Validate OpenSpec changes
        run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict
