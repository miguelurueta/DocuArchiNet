name: OPSXJ validation

on:
  pull_request:
    paths:
      - "tools/opsxj/**"
      - "openspec/**"
      - "Doc/Actualizacion/workflow/ImportarServicioWeb/**"
      - "js/workflow/importar-servicio-web/**"
      - "DTOs/Workflow/ImportarServicioWeb/**"
      - "Modelo/Workflow/ImportarServicioWeb/**"
      - "webservice/WebServiceImportarServicioWebModern.asmx.vb"
      - "workflow/Webworkflow.aspx.vb"
      - "tests/doc72-technical-documentation.test.cjs"
      - "tools/validation/Validate-Doc72DotNetSymbols.ps1"
      - ".github/workflows/opsxj-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: OpenSpec and opsxj tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/opsxj/package-lock.json

      - name: Install opsxj dependencies
        run: npm.cmd --prefix tools/opsxj ci

      - name: Run opsxj tests
        run: npm.cmd --prefix tools/opsxj test

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install .NET Framework 4.6.1 reference assemblies
        run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net461 -Version 1.0.3 -OutputDirectory .packages -NonInteractive

      - name: Build WebForms metadata for documentation checks
        run: msbuild GestionDocumental-Docuarchi.net.vbproj /t:Build /p:Configuration=Debug /p:TargetFrameworkRootPath="$pwd\.packages\Microsoft.NETFramework.ReferenceAssemblies.net461.1.0.3\build\" /m /nologo /v:minimal

      - name: Validate DOC-72 diagrams and JavaScript symbols
        run: node --test tests/doc72-technical-documentation.test.cjs

      - name: Validate DOC-72 .NET signatures
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/validation/Validate-Doc72DotNetSymbols.ps1 -ManifestPath ./Doc/Actualizacion/workflow/ImportarServicioWeb/DOC-72-nucleo-registro-adaptadores/diagram-contract.json -AssemblyPath ./bin/GestionDocumental-Docuarchi.net.dll

      - name: Validate OpenSpec changes
        run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict
