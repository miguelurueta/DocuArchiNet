module: otp
version: 1.0
scenarios:
  - id: OTP-001
    title: "OTP correcto emite token y navega"
    given:
      - "Usuario llega a /verificar-otp con challenge válido"
      - "API verify-otp responde SUCCESS con token"
    when:
      - "Usuario confirma OTP"
    then:
      - "Se persiste token en localStorage"
      - "Se navega a /dashboard sin recarga"
  - id: OTP-002
    title: "OTP inválido muestra error funcional"
    given:
      - "API verify-otp responde error funcional invalid"
    when:
      - "Usuario confirma OTP"
    then:
      - "Se muestra mensaje de código inválido"
      - "No se navega"
  - id: OTP-003
    title: "OTP expirado dispara flujo de expiración"
    given:
      - "El timer de OTP alcanza 0"
    when:
      - "Usuario espera vencimiento o intenta confirmar"
    then:
      - "Se muestra modal de expiración"
      - "Se redirige a login o se fuerza reintento"
