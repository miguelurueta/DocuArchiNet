module: auth
version: 1.0
scenarios:
  - id: AUTH-001
    title: "Login SUCCESS emite token y navega al dashboard"
    given:
      - "Usuario ingresa credenciales válidas"
      - "API responde con token y expiración"
    when:
      - "Usuario envía formulario de login"
    then:
      - "Se persiste token en localStorage"
      - "Se navega a /dashboard sin recarga"
      - "No se muestra pantalla OTP"
  - id: AUTH-002
    title: "Login SECOND_FACTOR navega a verificación OTP"
    given:
      - "API responde tipo SECOND_FACTOR_REQUIRED con payload de challenge"
    when:
      - "Usuario envía formulario de login"
    then:
      - "Se navega a /verificar-otp"
      - "Se muestra correo destino parcialmente oculto"
  - id: AUTH-003
    title: "Token expirado en ruta restringida fuerza logout"
    given:
      - "Existe token registrado y la ruta es restringida"
      - "TokenWatcher detecta token expirado"
    when:
      - "Transcurre el intervalo de validación"
    then:
      - "Se muestra aviso de sesión caducada"
      - "Se ejecuta logout/redirect"
