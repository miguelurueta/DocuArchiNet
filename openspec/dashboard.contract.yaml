module: dashboard
version: 1.0
contracts:
  menuNode:
    type: object
    required:
      - IdMenuPrincipal
      - NombreModulo
      - UrlNode
      - VisibleNode
      - IdPadre
      - Orden
      - AcesoDirecto
      - children
    rules:
      - children debe normalizarse siempre como array
      - los nodos con VisibleNode=0 solo se conservan si tienen descendencia visible
  dashboardMetric:
    type: object
    required:
      - nodeId
      - pendingCount
scenarios:
  - id: DASH-001
    title: Contrato mínimo para render inicial
  - id: DASH-002
    title: Contrato mínimo para navegación en card
